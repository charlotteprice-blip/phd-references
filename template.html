<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference List</title>
<meta name="description" content="APA 7th edition reference list from Charlotte Price Consulting.">
<meta property="og:title" content="Reference list">
<meta property="og:description" content="APA 7th edition reference list, {{COUNT}} references.">
<meta property="og:image" content="https://charlotteprice-blip.github.io/phd-references/assets/share-image.png">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  /* Charlotte Price Consulting tokens, brand v1.0 */
  :root {
    --canvas: #FFFBF4;
    --surface: #FFFFFF;
    --ink: #37221F;
    --ink-muted: rgba(55, 34, 31, 0.64);
    --border: rgba(55, 34, 31, 0.12);
    --border-strong: rgba(55, 34, 31, 0.24);
    --accent: #9BBAFA;
    --primary: #37221F;
    --primary-contrast: #FFFBF4;
    --primary-hover: #4A2E29;
    --shadow: 0 1px 2px rgba(55, 34, 31, 0.06);
    --logo-ink: block;
    --logo-cream: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #37221F;
      --surface: transparent;
      --ink: #FFFBF4;
      --ink-muted: rgba(255, 251, 244, 0.72);
      --border: rgba(255, 251, 244, 0.16);
      --border-strong: rgba(255, 251, 244, 0.32);
      --primary: #FFFBF4;
      --primary-contrast: #37221F;
      --primary-hover: #F6EFE2;
      --shadow: none;
      --logo-ink: none;
      --logo-cream: block;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font: 400 16px/1.6 "Fira Sans", system-ui, sans-serif;
  }
  ::selection { background: var(--accent); color: #37221F; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header { padding: 24px 0 8px; }
  header img { width: 153px; height: auto; }
  .logo-ink { display: var(--logo-ink); }
  .logo-cream { display: var(--logo-cream); }
  .intro { padding: 40px 0 24px; }
  h1 {
    font: 500 40px/1.1 "Instrument Sans", system-ui, sans-serif;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .meta { color: var(--ink-muted); font-size: 14px; margin: 0; }
  .tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 24px; }
  input[type=search] {
    flex: 1 1 260px;
    min-width: 0;
    font: 400 16px/1.4 "Fira Sans", system-ui, sans-serif;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 10px 14px;
  }
  input[type=search]::placeholder { color: var(--ink-muted); }
  input[type=search]:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
  .count { color: var(--ink-muted); font-size: 14px; }
  .button {
    display: inline-block;
    font: 500 14px/1 "Fira Sans", system-ui, sans-serif;
    color: var(--primary-contrast);
    background: var(--primary);
    border-radius: 999px;
    padding: 12px 18px;
    text-decoration: none;
  }
  .button:hover { background: var(--primary-hover); }
  .button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 32px;
    margin-bottom: 64px;
  }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding-left: 0.5in; text-indent: -0.5in; margin: 0 0 16px; overflow-wrap: anywhere; }
  li:last-child { margin-bottom: 0; }
  li[hidden] { display: none; }
  li a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }
  li a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .empty { color: var(--ink-muted); margin: 0; }
  footer { color: var(--ink-muted); font-size: 14px; padding: 0 0 48px; }
  @media (max-width: 560px) {
    h1 { font-size: 32px; }
    .intro { padding-top: 28px; }
    .card { padding: 20px 16px; border-radius: 12px; }
    li { padding-left: 24px; text-indent: -24px; }
  }
  @media print {
    header, .tools, footer { display: none; }
    html, body { background: #fff; color: #000; }
    .card { border: 0; box-shadow: none; padding: 0; }
    li { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo-ink" src="assets/cpc-lockup-ink.svg" alt="Charlotte Price Consulting" width="153" height="25">
    <img class="logo-cream" src="assets/cpc-lockup-cream.svg" alt="Charlotte Price Consulting" width="153" height="25">
  </header>
  <section class="intro">
    <h1>Reference list</h1>
    <p class="meta">APA 7th edition &middot; {{COUNT}} references &middot; last updated {{UPDATED}}</p>
    <div class="tools">
      <input type="search" id="q" placeholder="Search authors, titles or journals" aria-label="Search references">
      <span class="count" id="shown" aria-live="polite"></span>
      <a class="button" href="references.json" download>Download CSL JSON</a>
    </div>
  </section>
  <main class="card">
    <ol id="refs">
{{ENTRIES}}
    </ol>
    <p class="empty" id="none" hidden>No references match that search.</p>
  </main>
</div>
<script>
  const q = document.getElementById('q');
  const items = [...document.querySelectorAll('#refs li')];
  const shown = document.getElementById('shown');
  const none = document.getElementById('none');
  q.addEventListener('input', () => {
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    let n = 0;
    for (const li of items) {
      const hit = terms.every((t) => li.dataset.text.includes(t));
      li.hidden = !hit;
      if (hit) n++;
    }
    shown.textContent = terms.length ? n + ' of ' + items.length : '';
    none.hidden = n > 0;
  });
</script>
</body>
</html>
