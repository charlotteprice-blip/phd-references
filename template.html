<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference List</title>
<meta name="description" content="APA 7th edition reference list, updated automatically from current drafts.">
<style>
  :root {
    --bg: #fbfaf7;
    --text: #1f1d1a;
    --muted: #6b665e;
    --rule: #e3dfd6;
    --accent: #1d5c63;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514;
      --text: #ebe7e0;
      --muted: #a39d93;
      --rule: #33302c;
      --accent: #7cc4cb;
      --field: #1f1e1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-size: 30px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; margin: 0 0 4px; }
  .tools { display: flex; gap: 12px; align-items: center; margin: 24px 0 8px; flex-wrap: wrap; }
  input[type=search] {
    flex: 1 1 260px;
    font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .count { color: var(--muted); font: 14px -apple-system, "Segoe UI", system-ui, sans-serif; }
  .tools a { color: var(--accent); font: 14px -apple-system, "Segoe UI", system-ui, sans-serif; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 16px 0 24px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding-left: 0.5in; text-indent: -0.5in; margin: 0 0 14px; overflow-wrap: anywhere; }
  li[hidden] { display: none; }
  li a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  @media (max-width: 520px) { li { padding-left: 24px; text-indent: -24px; } body { font-size: 16px; } }
  @media print {
    .tools, hr { display: none; }
    body { background: #fff; color: #000; }
    li { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <h1>Reference list</h1>
  <p class="meta">APA 7th edition &middot; {{COUNT}} references &middot; last updated {{UPDATED}}</p>
  <p class="meta">Built from the current drafts of: {{BUILT_FROM}}.</p>
  <div class="tools">
    <input type="search" id="q" placeholder="Search authors, titles, journals" aria-label="Search references">
    <span class="count" id="shown"></span>
    <a href="references.json" download>CSL JSON</a>
  </div>
  <hr>
  <ol id="refs">
{{ENTRIES}}
  </ol>
</main>
<script>
  const q = document.getElementById('q');
  const items = [...document.querySelectorAll('#refs li')];
  const shown = document.getElementById('shown');
  function filter() {
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    let n = 0;
    for (const li of items) {
      const hit = terms.every((t) => li.dataset.text.includes(t));
      li.hidden = !hit;
      if (hit) n++;
    }
    shown.textContent = terms.length ? n + ' of ' + items.length : '';
  }
  q.addEventListener('input', filter);
</script>
</body>
</html>
